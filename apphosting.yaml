# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
# The backend's service account has been granted IAM permissions to access
# the Vertex AI API, so a GEMINI_API_KEY secret is no longer required.
# Genkit will use Application Default Credentials automatically.
secrets: []
